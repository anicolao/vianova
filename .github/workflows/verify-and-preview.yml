name: Verify and preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run test:unit
      - run: bun run test:e2e
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  preview:
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Choose retained preview path
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "base=/vianova/pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "destination=pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "base=/vianova" >> "$GITHUB_OUTPUT"
            echo "destination=" >> "$GITHUB_OUTPUT"
          fi
      - run: bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}
      - name: Publish retained static review
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: ${{ steps.target.outputs.destination }}
          keep_files: true
